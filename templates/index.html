<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Page</title>
</head>
<body>
    <h1>STUDENT:</h1>
    <ul>
    {% for key,value in student.items() %}
    <li><H3>{{key}} : {{value}}</H3></li>
    {% endfor %}
    </ul>
    <hr>

    <h1>COURSES:</h1>
    <ul>
    {% for course in courses %}
    <li>{{loop.index}} {{course}}</li>
    {% endfor %}
    </ul>
</body>
</html>
